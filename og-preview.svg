<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: match bg-stone-100 from website aka #f5f5f4 -->
  <rect width="100%" height="100%" fill="#f5f5f4"/>
  
  <!-- Decorative Border - minimalist like the site -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#991b1b" stroke-width="4"/>
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="#292524" stroke-width="2"/>

  <!-- Centered Content Group -->
  <g transform="translate(600, 315)">
    
    <!-- Byzantine and Maronite crosses from the site's public assets -->
    <g transform="translate(-110, -60) scale(10)" stroke="#991b1b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(-12, -12)">
        <line x1="12" y1="2" x2="12" y2="22"></line>
        <line x1="9" y1="6" x2="15" y2="6"></line>
        <line x1="5" y1="10" x2="19" y2="10"></line>
        <line x1="8" y1="15" x2="16" y2="18"></line>
      </g>
    </g>
    <g transform="translate(110, -60) scale(10)" stroke="#991b1b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(-12, -12)">
        <line x1="12" y1="2" x2="12" y2="22"></line>
        <line x1="9" y1="5" x2="15" y2="5"></line>
        <line x1="7" y1="8.5" x2="17" y2="8.5"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </g>
    </g>

    <!-- Text -->
    <!-- Font-family: serif, matching the website's clean serif aesthetic -->
    <text y="180" dominant-baseline="middle" text-anchor="middle" font-family="ui-serif, Georgia, Cambria, 'Times New Roman', Times, serif" font-size="72" fill="#292524" font-weight="bold" letter-spacing="-0.025em">Eastern Catholic</text>
    <text y="250" dominant-baseline="middle" text-anchor="middle" font-family="ui-serif, Georgia, Cambria, 'Times New Roman', Times, serif" font-size="48" fill="#57534e" font-style="italic">Readings</text>
  </g>
</svg>